# 瘦身版：**不带** Node 运行时（ADR-0053 §2）。与 electron-builder.yml 唯一的区别就是
# extraResources 里少了 node-runtime 那一条 —— 所以这里是完整配置，不用 extends
# （`extends` 会把数组**合并**，node_modules 被拷两遍，第二次撞 EEXIST）。
#
# 壳启动时会实测候选 node：用户机器上有 node ≥22.19 就用他的，没有才需要包里这份。
#   npm run app:dist      带运行时（实测 dmg ~185MB）—— 下载即用，不依赖用户环境
#   npm run app:dist:thin 不带（实测 dmg ~130MB）—— 依赖用户自己装了 node 22+
appId: com.popagent.app
productName: PopAgent
# 同 electron-builder.yml：Electron 的入口固定是 electron-dist，
# 不跟 package.json 里的 npm 入口（dist/server/index.js）挤同一个字段。
extraMetadata:
  main: electron-dist/electron/main.js
directories:
  output: release
  buildResources: build
# 同 electron-builder.yml：没证书时补 ad-hoc 签名，避免产出报「已损坏」的包
afterPack: scripts/after-pack.cjs
npmRebuild: false
# Electron 自带 55 个语言包（Chromium 的界面文案，约 27MB）。界面是我们自己的网页，
# 这些只影响系统级对话框/右键菜单，留中英就够。
electronLanguages:
  - en
  - zh_CN
files:
  # 只打包壳自己的 JS。**排除 node_modules**：依赖是给「服务进程」用的，
  # 它从 Resources/node_modules 加载（extraResources 那份）。不排除的话 electron-builder
  # 会把生产依赖再塞进 app.asar 一份 —— 实测 94MB 的重复。
  - "!node_modules/**/*"
  - electron-dist/**/*
  - package.json
extraResources:
  - from: dist
    to: dist
  - from: web/dist
    to: web/dist
  - from: .pkg/node_modules
    to: node_modules
mac:
  category: public.app-category.developer-tools
  # 同 electron-builder.yml：不开 forceCodeSigning（没证书就无法出包），
  # 发版门禁走 after-pack.cjs 的 POP_AGENT_REQUIRE_DEV_ID=1
  icon: web/public/icons/icon-512.png
  target:
    - dmg
  hardenedRuntime: true
  # 同 electron-builder.yml：麦克风要 `com.apple.security.device.audio-input`，
  # 不开的话 hardened runtime 下 TCC 直接拒绝且不弹授权框（语音输入静默失效）
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: 用本机做语音识别（听写）
    NSCameraUsageDescription: 屏幕共享与画面采集时需要
win:
  icon: web/public/icons/icon-512.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
